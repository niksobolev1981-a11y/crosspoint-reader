name: Build Reader Notes for X4 Pro

on:
  push:
    branches:
      - reader-notes-1.6.5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x4pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply Reader Notes prototype
        run: |
          cat reader-notes-patch/00.patch reader-notes-patch/01.patch reader-notes-patch/02.patch reader-notes-patch/03.patch > /tmp/reader-notes.patch
          git apply --check /tmp/reader-notes.patch
          git apply /tmp/reader-notes.patch
          python reader-notes-patch/apply-notebook-view.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Install X4 Pro packages
        run: |
          pio pkg install -e x4pro-gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build X4 Pro firmware
        run: pio run -e x4pro-gh_release -j1

      - name: Stage firmware
        run: |
          cp .pio/build/x4pro-gh_release/firmware.bin crosspoint-1.6.5-reader-notes-x4pro.bin
          sha256sum crosspoint-1.6.5-reader-notes-x4pro.bin > crosspoint-1.6.5-reader-notes-x4pro.sha256

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: crosspoint-1.6.5-reader-notes-x4pro
          path: |
            crosspoint-1.6.5-reader-notes-x4pro.bin
            crosspoint-1.6.5-reader-notes-x4pro.sha256
          if-no-files-found: error
          compression-level: 0
